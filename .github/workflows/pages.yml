name: Validar y desplegar Energía Perú OLAP

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: olap-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias Python y Node
        run: |
          python -m pip install -r requirements.txt
          npm ci
      - name: Ejecutar pruebas unitarias de consultas SQL OLAP
        run: npm run test:queries
      - name: Generar y validar el modelo estrella en Apache Parquet
        run: python scripts/build_data.py
      - name: Compilar aplicación con DuckDB-Wasm
        run: npm run build
      - name: Preparar artefacto para GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
